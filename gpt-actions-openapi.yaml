openapi: 3.1.0
info:
  title: CallCallum First Calls API
  version: 1.0.0
  description: Loads and records private First Calls MSP call-readiness assessments.
servers:
  - url: https://training-jade-ten.vercel.app/api
paths:
  /gpt/first-calls/{assessment_code}:
    get:
      operationId: getFirstCallsAssessment
      summary: Validate an assessment code and get candidate progress
      parameters:
        - $ref: '#/components/parameters/AssessmentCode'
        - name: candidate_name
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Assessment progress and next required step }
        '403': { description: Candidate name does not match the assessment }
        '404': { description: Assessment code not found }
  /gpt/first-calls/{assessment_code}/start:
    post:
      operationId: startFirstCallsCall
      summary: Start the next fixed First Calls scenario
      parameters:
        - $ref: '#/components/parameters/AssessmentCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidate_name]
              properties:
                candidate_name: { type: string }
      responses:
        '200': { description: Session ID and private caller scenario instructions }
        '409': { description: Finish the current call/ticket or assessment is complete }
  /gpt/first-calls/{assessment_code}/submit:
    post:
      operationId: submitFirstCallsCall
      summary: Save one completed transcript, ticket, and structured checkpoint evidence
      parameters:
        - $ref: '#/components/parameters/AssessmentCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidate_name, session_id, transcript, candidate_ticket_text, checkpoint_results]
              properties:
                candidate_name: { type: string }
                session_id: { type: string, format: uuid }
                transcript:
                  type: array
                  minItems: 6
                  maxItems: 100
                  items:
                    type: object
                    required: [speaker, text]
                    properties:
                      speaker: { type: string, enum: [candidate, caller] }
                      text: { type: string }
                candidate_ticket_text: { type: string }
                checkpoint_results:
                  type: object
                  additionalProperties:
                    type: object
                    required: [passed, evidence]
                    properties:
                      passed: { type: boolean }
                      evidence: { type: string }
                feedback_summary: { type: string }
      responses:
        '200': { description: Call saved and next-step state }
        '400': { description: Transcript, ticket, or evidence is incomplete }
        '409': { description: Call was already submitted }
components:
  parameters:
    AssessmentCode:
      name: assessment_code
      in: path
      required: true
      schema: { type: string }
  securitySchemes:
    actionApiKey:
      type: apiKey
      in: header
      name: x-api-key
security:
  - actionApiKey: []
